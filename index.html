const CSV_MAP = {

  "colaborador":      "colaborador",

  "razão social":     "razaoSocial",

  "observacao":       "observacao",
  "observação":       "observacao",
};

function normKey(k){ return k.trim().toLowerCase().replace(/\s+/g," "); }

function parseCSV(text){
  const lines = text.replace(/\r/g,"").split("\n").filter(Boolean);
  if(lines.length<2) return [];
  const sep = lines[0].includes(";") ? ";" : ",";
  const headers = lines[0].split(sep).map(h => normKey(h.replace(/"/g,"")));
  const mapped  = headers.map(h => CSV_MAP[h]||h);
  return lines.slice(1).map(line => {
    const cols = line.split(sep).map(c => c.replace(/"/g,"").trim());
    const obj = {feriasColetiva:null};
    mapped.forEach((key,i) => { obj[key]=(cols[i]||"").trim(); });
    if(obj.feriasColetiva==="") obj.feriasColetiva=null;
    return obj;
  });
}

function downloadCSV(rows, filename){
  const h = ["Matricula","Colaborador","Cargo","Razao Social","Centro de Custo","Gestor Direto","Diretor","Regional","Email","Ferias Coletiva"];
  const lines = [h.join(";")].concat(rows.map(c =>
    [c.matricula,c.colaborador,c.cargo,c.razaoSocial,c.centroCusto,c.gestorDireto,c.diretor,c.regional,c.email,c.feriasColetiva||"Pendente"].join(";")
  ));
  const blob = new Blob(["\uFEFF"+lines.join("\n")],{type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}

function Resumo({dados, onExport}){
  const regionais = React.useMemo(() => {
    const regs = [...new Set(dados.map(c=>c.regional).filter(Boolean))].sort();
    return regs.map(r => {
      const g=dados.filter(c=>c.regional===r);
      const sim=g.filter(c=>c.feriasColetiva==="Sim").length;
      const nao=g.filter(c=>c.feriasColetiva==="Nao").length;
      const pend=g.filter(c=>!c.feriasColetiva).length;
      const tot=g.length;
      return {r,sim,nao,pend,total:tot,pct:tot>0?Math.round(((sim+nao)/tot)*100):0};
    });
  },[dados]);
  const tot = regionais.reduce((a,r)=>({sim:a.sim+r.sim,nao:a.nao+r.nao,pend:a.pend+r.pend,total:a.total+r.total}),{sim:0,nao:0,pend:0,total:0});
  const gestoresPend = React.useMemo(()=>{
    const m={};
    dados.forEach(c=>{
      if(!c.feriasColetiva&&c.gestorDireto){
        if(!m[c.gestorDireto]) m[c.gestorDireto]={gestor:c.gestorDireto,regional:c.regional,pend:0};
        m[c.gestorDireto].pend++;
      }
    });
    return Object.values(m).sort((a,b)=>b.pend-a.pend).slice(0,10);
  },[dados]);

  return <div style={{paddingTop:4}}>
    <div style={{display:"flex",gap:12,marginBottom:20,flexWrap:"wrap"}}>
      {[{label:"Total geral",val:tot.total,bg:"#ede9fe",color:"#5b21b6"},{label:"Sim — Férias",val:tot.sim,bg:"#dcfce7",color:"#166534"},
        {label:"Não — Férias",val:tot.nao,bg:"#fee2e2",color:"#991b1b"},{label:"Pendentes",val:tot.pend,bg:"#fef9c3",color:"#854d0e"},
        {label:"% Respondido",val:tot.total>0?Math.round(((tot.sim+tot.nao)/tot.total)*100)+"%":"—",bg:"#f0fdf4",color:"#166534"},
      ].map(c=><div key={c.label} style={{background:c.bg,borderRadius:12,padding:"12px 20px",minWidth:110}}>
        <div style={{fontSize:24,fontWeight:800,color:c.color}}>{c.val}</div>
        <div style={{fontSize:11,color:c.color,opacity:0.8}}>{c.label}</div>
      </div>)}
    </div>
    <div style={{display:"flex",gap:10,marginBottom:20,flexWrap:"wrap"}}>
      {[{tipo:"todos",bg:"#7c3aed",label:"⬇️ Exportar tudo"},{tipo:"sim",bg:"#166534",label:"⬇️ Exportar Sim"},
        {tipo:"nao",bg:"#991b1b",label:"⬇️ Exportar Não"},{tipo:"pendente",bg:"#854d0e",label:"⬇️ Exportar Pendentes"}
      ].map(b=><button key={b.tipo} onClick={()=>onExport(b.tipo)}
        style={{background:b.bg,color:"#fff",border:"none",borderRadius:8,padding:"8px 18px",fontWeight:600,fontSize:13,cursor:"pointer"}}>{b.label}</button>)}
    </div>
    <div style={{background:"#fff",borderRadius:14,border:"1px solid #e2e8f0",overflow:"hidden",marginBottom:22}}>
      <div style={{padding:"14px 18px",borderBottom:"1px solid #e2e8f0",fontWeight:700,fontSize:14}}>📊 Resultado por Regional</div>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
        <thead><tr style={{background:"#f8fafc",borderBottom:"2px solid #e2e8f0"}}>
          {["Regional","Total","Sim","Não","Pendentes","% Respondido","Progresso"].map(h=><th key={h} style={{padding:"10px 16px",textAlign:"left",color:"#64748b",fontWeight:600,fontSize:12,whiteSpace:"nowrap"}}>{h}</th>)}
        </tr></thead>
        <tbody>
          {regionais.map((r,i)=><tr key={r.r} style={{borderBottom:"1px solid #f1f5f9",background:i%2===0?"#fff":"#fafafa"}}>
            <td style={{padding:"10px 16px"}}><span style={{background:"#ede9fe",color:"#5b21b6",borderRadius:20,padding:"2px 10px",fontSize:12,fontWeight:600}}>{r.r}</span></td>
            <td style={{padding:"10px 16px",fontWeight:700}}>{r.total}</td>
            <td style={{padding:"10px 16px",color:"#166534",fontWeight:600}}>{r.sim}</td>
            <td style={{padding:"10px 16px",color:"#991b1b",fontWeight:600}}>{r.nao}</td>
            <td style={{padding:"10px 16px",color:"#854d0e",fontWeight:600}}>{r.pend}</td>
            <td style={{padding:"10px 16px",fontWeight:700}}>{r.pct}%</td>
            <td style={{padding:"10px 16px",minWidth:140}}>
              <div style={{background:"#f1f5f9",borderRadius:99,height:8,overflow:"hidden"}}>
                <div style={{width:r.pct+"%",background:r.pct===100?"#22c55e":r.pct>60?"#7c3aed":"#f59e0b",height:"100%",borderRadius:99}}/>
              </div>
            </td>
          </tr>)}
          <tr style={{borderTop:"2px solid #e2e8f0",background:"#f8fafc",fontWeight:700}}>
            <td style={{padding:"10px 16px"}}><b>TOTAL</b></td>
            <td style={{padding:"10px 16px"}}>{tot.total}</td>
            <td style={{padding:"10px 16px",color:"#166534"}}>{tot.sim}</td>
            <td style={{padding:"10px 16px",color:"#991b1b"}}>{tot.nao}</td>
            <td style={{padding:"10px 16px",color:"#854d0e"}}>{tot.pend}</td>
            <td style={{padding:"10px 16px"}}>{tot.total>0?Math.round(((tot.sim+tot.nao)/tot.total)*100)+"%":"—"}</td>
            <td/>
          </tr>
        </tbody>
      </table>
    </div>
    {gestoresPend.length>0&&<div style={{background:"#fff",borderRadius:14,border:"1px solid #e2e8f0",overflow:"hidden"}}>
      <div style={{padding:"14px 18px",borderBottom:"1px solid #e2e8f0",fontWeight:700,fontSize:14}}>⏳ Gestores com mais pendências</div>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
        <thead><tr style={{background:"#f8fafc",borderBottom:"2px solid #e2e8f0"}}>
          {["Gestor Direto","Regional","Pendentes"].map(h=><th key={h} style={{padding:"10px 16px",textAlign:"left",color:"#64748b",fontWeight:600,fontSize:12}}>{h}</th>)}
        </tr></thead>
        <tbody>
          {gestoresPend.map((g,i)=><tr key={g.gestor} style={{borderBottom:"1px solid #f1f5f9",background:i%2===0?"#fff":"#fafafa"}}>
            <td style={{padding:"9px 16px",fontWeight:600}}>{g.gestor}</td>
            <td style={{padding:"9px 16px"}}><span style={{background:"#ede9fe",color:"#5b21b6",borderRadius:20,padding:"2px 10px",fontSize:11,fontWeight:600}}>{g.regional}</span></td>
            <td style={{padding:"9px 16px"}}><span style={{background:"#fef9c3",color:"#854d0e",borderRadius:20,padding:"2px 10px",fontSize:12,fontWeight:700}}>{g.pend}</span></td>
          </tr>)}
        </tbody>
      </table>
    </div>}

}

function App(){
  const [uInput,setUInput]     = React.useState("");
  const [pInput,setPInput]     = React.useState("");
  const [showPass,setShowPass] = React.useState(false);

  const [loading,setLoading]   = React.useState(false);
  const [user,setUser]         = React.useState(null);
  const [dados,setDados]       = React.useState([]);

  const [savedMsg,setSavedMsg] = React.useState("");
  const [regFiltro,setRegFiltro]       = React.useState("Todas");

  const [aba,setAba]           = React.useState("lista");
  const [alterados,setAlterados] = React.useState({});

  async function fetchSheet(aba){
    const res = await fetch(sheetURL(aba));
    if(!res.ok) throw new Error("Não foi possível acessar a planilha. Verifique se está pública.");
    return parseCSV(await res.text());
  }

  async function handleLogin(){
    setLoginErr(""); setLoading(true);
    const email = uInput.trim().toLowerCase();
    const senha = pInput.trim();
    try{
      const curinga = CURINGAS.find(u => u.email.toLowerCase()===email && u.senha===senha);
      if(curinga){
        setUser({email:curinga.email,nome:curinga.nome,perfil:curinga.perfil,regionais:curinga.regionais,nomeGestor:""});
        setDados(await fetchSheet(SHEETS_ABA));
        setLoading(false); return;
      }
      const colab = await fetchSheet(SHEETS_ABA);
      const row   = colab.find(c => (c.emailGestor||"").toLowerCase()===email && c.cpfGestor===senha);
      if(row){
        setUser({email,nome:row.gestorDireto,perfil:"gestor",regionais:[],nomeGestor:row.gestorDireto});
        setDados(colab);
        setLoading(false); return;
      }
      setLoginErr("Usuário ou senha incorretos.");
    }catch(e){ setLoginErr(e.message); }
    setLoading(false);
  }

  const dadosUsuario = React.useMemo(()=>{
    if(!user) return [];
    if(user.perfil==="admin")    return dados;
    if(user.perfil==="regional") return dados.filter(c => user.regionais.map(r=>r.trim().toUpperCase()).includes((c.regional||"").trim().toUpperCase()));
    if(user.perfil==="gestor")   return dados.filter(c => c.gestorDireto===user.nomeGestor);
    return [];
  },[dados,user]);

  const regionaisDoUsuario = React.useMemo(()=>
    [...new Set(dadosUsuario.map(c=>c.regional).filter(Boolean))].sort()
  ,[dadosUsuario]);

  // Gestores disponíveis com base na regional selecionada
  const gestoresDoUsuario = React.useMemo(()=>{
    let base = dadosUsuario;
    if(regFiltro!=="Todas") base=base.filter(c=>c.regional.trim().toUpperCase()===regFiltro.trim().toUpperCase());
    return [...new Set(base.map(c=>(c.gestorDireto||"").trim()).filter(Boolean))].sort();
  },[dadosUsuario,regFiltro]);

  const lista = React.useMemo(()=>{
    let l=dadosUsuario;
    if(regFiltro!=="Todas") l=l.filter(c=>c.regional===regFiltro);
    if(search) l=l.filter(c=>
      (c.colaborador||"").toLowerCase().includes(search.toLowerCase()) ||
      (c.matricula||"").includes(search) ||
      (c.gestorDireto||"").toLowerCase().includes(search.toLowerCase())
    );
    if(filtro==="Sim")      l=l.filter(c=>c.feriasColetiva==="Sim");
    if(filtro==="Nao")      l=l.filter(c=>c.feriasColetiva==="Nao");
    if(filtro==="Pendente") l=l.filter(c=>!c.feriasColetiva);
    return l;
  },[dadosUsuario,search,filtro,regFiltro]);

  function toggle(matricula,op){
    setDados(prev=>prev.map(c=>c.matricula===matricula?{...c,feriasColetiva:c.feriasColetiva===op?null:op}:c));
    setAlterados(prev=>({...prev,[matricula]:true}));
  }

  function setObs(matricula,valor){
    setDados(prev=>prev.map(c=>c.matricula===matricula?{...c,observacao:valor}:c));
    setAlterados(prev=>({...prev,[matricula]:true}));
  }

  async function salvar(){
    setSaving(true); setSavedMsg("");
    // Envia apenas os registros alterados
    const payload = dados
      .filter(c=>alterados[c.matricula])
      .map(c=>({
        colaborador: String(c.colaborador).trim(),
        feriasColetiva: c.feriasColetiva||"",
        observacao: c.observacao||""
      }));
    if(payload.length===0){
      setSavedMsg("Nada para salvar.");
      setSaving(false); setTimeout(()=>setSavedMsg(""),3000);
      return;
    }
    try{
      await fetch(APPS_SCRIPT_URL, {
        method:"POST",
        mode:"no-cors",
        headers:{ "Content-Type":"text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      setSavedMsg("✅ "+payload.length+" registro(s) salvos!");
      setAlterados({});
    }catch(e){ setSavedMsg("❌ Erro ao salvar."); }
    setSaving(false); setTimeout(()=>setSavedMsg(""),4000);
  }

  function handleExport(tipo){
    let rows=dadosUsuario;
    if(tipo==="sim")      rows=rows.filter(c=>c.feriasColetiva==="Sim");
    if(tipo==="nao")      rows=rows.filter(c=>c.feriasColetiva==="Nao");
    if(tipo==="pendente") rows=rows.filter(c=>!c.feriasColetiva);
    downloadCSV(rows,"ferias_coletiva_"+tipo+"_"+new Date().toISOString().slice(0,10)+".csv");
  }

  if(!user) return (
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#ede9fe 0%,#f8fafc 100%)",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{background:"#fff",borderRadius:20,padding:"40px 36px",width:390,boxShadow:"0 8px 40px rgba(124,58,237,0.10)"}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:28}}>
          <div style={{background:"#7c3aed",borderRadius:12,width:46,height:46,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24}}>📅</div>
          <div>
            <div style={{fontWeight:800,fontSize:18,color:"#1e1b4b"}}>Férias Coletiva</div>
            <div style={{color:"#7c3aed",fontSize:13,fontWeight:600}}>SPCORP</div>
          </div>
        </div>
        <div style={{marginBottom:14}}>
          <label style={{fontSize:13,fontWeight:600,color:"#475569",display:"block",marginBottom:5}}>E-mail corporativo</label>
          <input value={uInput} onChange={e=>setUInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleLogin()} placeholder="nome@empresa.com"
            style={{width:"100%",border:"1px solid #cbd5e1",borderRadius:8,padding:"10px 14px",fontSize:14,boxSizing:"border-box"}}/>
        </div>
        <div style={{marginBottom:20,position:"relative"}}>
          <label style={{fontSize:13,fontWeight:600,color:"#475569",display:"block",marginBottom:5}}>Senha</label>
          <input type={showPass?"text":"password"} value={pInput} onChange={e=>setPInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleLogin()} placeholder="Senha"
            style={{width:"100%",border:"1px solid #cbd5e1",borderRadius:8,padding:"10px 14px",fontSize:14,boxSizing:"border-box"}}/>
          <span onClick={()=>setShowPass(!showPass)} style={{position:"absolute",right:12,top:34,cursor:"pointer",fontSize:16,color:"#94a3b8"}}>{showPass?"🙈":"👁️"}</span>
        </div>
        {loginErr&&<div style={{background:"#fee2e2",color:"#991b1b",borderRadius:8,padding:"8px 12px",fontSize:13,marginBottom:14}}>{loginErr}</div>}
        <button onClick={handleLogin} disabled={loading}
          style={{width:"100%",background:loading?"#a78bfa":"#7c3aed",color:"#fff",border:"none",borderRadius:10,padding:"12px 0",fontWeight:700,fontSize:15,cursor:loading?"default":"pointer"}}>
          {loading?"Verificando...":"Entrar"}
        </button>
      </div>
    </div>
  );

  const pendentes   = lista.filter(c=>!c.feriasColetiva).length;
  const respondidos = lista.filter(c=>c.feriasColetiva).length;

  return (
    <div style={{minHeight:"100vh",background:"#f8fafc"}}>
      <div style={{background:"#fff",borderBottom:"1px solid #e2e8f0",padding:"12px 24px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{background:"#7c3aed",borderRadius:10,width:38,height:38,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>📅</div>
          <div>
            <div style={{fontWeight:700,fontSize:16}}>Férias Coletiva — SPCORP</div>
            <div style={{fontSize:12,color:"#64748b",display:"flex",alignItems:"center",gap:4}}><PerfilBadge p={user.perfil}/>{user.nome}</div>
          </div>
        </div>
        <button onClick={()=>{setUser(null);setUInput("");setPInput("");setDados([]);}}
          style={{background:"none",border:"1px solid #e2e8f0",borderRadius:8,padding:"7px 14px",cursor:"pointer",color:"#64748b",fontSize:13}}>Sair</button>
      </div>

      <div style={{maxWidth:1300,margin:"0 auto",padding:"18px 16px"}}>
        <div style={{display:"flex",gap:4,marginBottom:20,borderBottom:"2px solid #e2e8f0"}}>
          {[{id:"lista",label:"📋 Lista de Colaboradores"},{id:"resumo",label:"📊 Resumo & Exportar"}].map(tab=>{
            const active=aba===tab.id;
            return <button key={tab.id} onClick={()=>setAba(tab.id)}
              style={{border:"none",background:"none",padding:"10px 20px",fontWeight:700,fontSize:14,cursor:"pointer",
                color:active?"#7c3aed":"#94a3b8",borderBottom:active?"3px solid #7c3aed":"3px solid transparent",marginBottom:-2}}>{tab.label}</button>;
          })}
        </div>

        {aba==="resumo"&&<Resumo dados={dadosUsuario} onExport={handleExport}/>}

        {aba==="lista"&&<div>
          <div style={{display:"flex",gap:12,marginBottom:18,flexWrap:"wrap"}}>
            {[{label:"Visíveis",val:lista.length,bg:"#ede9fe",color:"#5b21b6"},{label:"Respondidos",val:respondidos,bg:"#dcfce7",color:"#166534"},
              {label:"Pendentes",val:pendentes,bg:"#fef9c3",color:"#854d0e"},{label:"Total equipe",val:dadosUsuario.length,bg:"#f1f5f9",color:"#475569"},
            ].map(c=><div key={c.label} style={{background:c.bg,borderRadius:12,padding:"12px 20px",minWidth:110}}>
              <div style={{fontSize:24,fontWeight:800,color:c.color}}>{c.val}</div>
              <div style={{fontSize:12,color:c.color,opacity:0.8}}>{c.label}</div>
            </div>)}
          </div>
          <div style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap",alignItems:"center"}}>
            {regionaisDoUsuario.length>1&&<select value={regFiltro} onChange={e=>{setRegFiltro(e.target.value);setGestorFiltro("");}}
              style={{border:"1px solid #e2e8f0",borderRadius:8,padding:"8px 12px",fontSize:13,color:"#475569",background:"#fff",cursor:"pointer"}}>
              <option value="Todas">Todas as regionais</option>
              {regionaisDoUsuario.map(r=><option key={r} value={r}>{r}</option>)}
            </select>}
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Buscar nome, matrícula ou gestor..."
              style={{flex:1,minWidth:180,border:"1px solid #e2e8f0",borderRadius:8,padding:"8px 14px",fontSize:13}}/>
            {["Todos","Sim","Nao","Pendente"].map(f=><button key={f} onClick={()=>setFiltro(f)}
              style={{border:"none",borderRadius:8,padding:"7px 14px",cursor:"pointer",fontSize:13,fontWeight:600,
                background:filtro===f?"#7c3aed":"#e2e8f0",color:filtro===f?"#fff":"#475569"}}>{f==="Nao"?"Não":f}</button>)}
            <button onClick={()=>handleExport("todos")}
              style={{border:"none",borderRadius:8,padding:"7px 14px",cursor:"pointer",fontSize:13,fontWeight:600,background:"#f1f5f9",color:"#475569"}}>⬇️ CSV</button>
          </div>
          <div style={{background:"#fff",borderRadius:14,border:"1px solid #e2e8f0",overflow:"hidden"}}>
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                <thead><tr style={{background:"#f8fafc",borderBottom:"2px solid #e2e8f0"}}>
                  {COLS.map(col=><th key={col.key} style={{padding:"11px 14px",textAlign:"left",color:"#64748b",fontWeight:600,fontSize:12,whiteSpace:"nowrap"}}>{col.label}</th>)}
                </tr></thead>
                <tbody>
                  {lista.length===0
                    ?<tr><td colSpan={COLS.length} style={{padding:40,textAlign:"center",color:"#94a3b8"}}>Nenhum colaborador encontrado.</td></tr>
                    :lista.map((c,i)=><tr key={c.matricula||i} style={{borderBottom:"1px solid #f1f5f9",background:i%2===0?"#fff":"#fafafa"}}>
                      <td style={{padding:"8px 14px"}}>
                        <div style={{display:"flex",gap:5}}>
                          {["Sim","Nao"].map(op=><button key={op} onClick={()=>toggle(c.matricula,op)} style={tagStyle(c.feriasColetiva===op,op)}>{op==="Nao"?"Não":op}</button>)}
                        </div>
                      </td>
                      <td style={{padding:"8px 14px"}}>
                        {user.perfil==="admin"
                          ?<input value={c.observacao||""} onChange={e=>setObs(c.matricula,e.target.value)} placeholder="Observação..."
                            style={{border:"1px solid #e2e8f0",borderRadius:6,padding:"5px 10px",fontSize:12,minWidth:160}}/>
                          :<span style={{color:c.observacao?"#166534":"#cbd5e1",fontSize:12,fontStyle:c.observacao?"normal":"italic"}}>
                            {c.observacao||"—"}
                          </span>}
                      </td>
                      <td style={{padding:"8px 14px",fontWeight:700,whiteSpace:"nowrap"}}>{c.matricula}</td>
                      <td style={{padding:"8px 14px",whiteSpace:"nowrap"}}>{c.colaborador}</td>
                      <td style={{padding:"8px 14px",color:"#64748b",fontSize:12}}>{c.razaoSocial}</td>
                      <td style={{padding:"8px 14px",whiteSpace:"nowrap"}}>{c.gestorDireto}</td>
                      <td style={{padding:"8px 14px",whiteSpace:"nowrap"}}>{c.diretor}</td>
                      <td style={{padding:"8px 14px"}}><span style={{background:"#ede9fe",color:"#5b21b6",borderRadius:20,padding:"2px 10px",fontSize:11,fontWeight:600}}>{c.regional}</span></td>
                      <td style={{padding:"8px 14px",color:"#64748b"}}>{c.cargo}</td>
                      <td style={{padding:"8px 14px",color:"#64748b"}}>{c.centroCusto}</td>
                      <td style={{padding:"8px 14px",color:"#64748b",fontSize:12}}>{c.email}</td>
                    </tr>)}
                </tbody>
              </table>
            </div>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:16,flexWrap:"wrap",gap:10}}>
            <span style={{fontSize:13,color:"#94a3b8"}}>{lista.length} colaboradores exibidos</span>
            <div style={{display:"flex",alignItems:"center",gap:14}}>
              {savedMsg&&<span style={{fontSize:14}}>{savedMsg}</span>}
              <button onClick={salvar} disabled={saving}
                style={{background:saving?"#a78bfa":"#7c3aed",color:"#fff",border:"none",borderRadius:10,padding:"11px 28px",fontWeight:700,fontSize:14,cursor:saving?"default":"pointer"}}>
                {saving?"Salvando...":"💾 Salvar Respostas"}
              </button>
            </div>
          </div>
        </div>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
