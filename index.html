<style>
:root{
  --bg:#050d1c; --bg2:#0a1830; --card:rgba(10,28,58,.72); --ink:#e6f1ff; --muted:#7f9bbd;
  --line:rgba(56,189,248,.28); --cyan:#38bdf8; --cyan-soft:rgba(56,189,248,.14);
  --green:#2fd6a0; --green-soft:rgba(47,214,160,.15);
  --red:#ff5d6c; --red-soft:rgba(255,93,108,.16);
  --amber:#ffc83d; --amber-soft:rgba(255,200,61,.15);
  --gray-soft:rgba(127,155,189,.14);
  --glow:0 0 0 1px rgba(56,189,248,.18),0 0 24px rgba(56,189,248,.08) inset;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);display:flex;min-height:100vh;
  background:radial-gradient(1200px 600px at 70% -10%,#0f2a55 0%,transparent 60%),
             linear-gradient(rgba(56,189,248,.04) 1px,transparent 1px) 0 0/40px 40px,
             linear-gradient(90deg,rgba(56,189,248,.04) 1px,transparent 1px) 0 0/40px 40px,var(--bg);background-attachment:fixed}
aside{width:250px;background:rgba(6,16,36,.85);border-right:1px solid var(--line);padding:24px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px;flex-shrink:0}
.brand{display:flex;gap:10px;align-items:center}
.brand .logo{width:40px;height:40px;border-radius:10px;background:var(--cyan-soft);border:1px solid var(--cyan);color:var(--cyan);display:grid;place-items:center;font-size:22px;box-shadow:0 0 14px rgba(56,189,248,.45)}
.brand b{display:block;font-size:15px}.brand small{color:var(--muted)}
.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--cyan);margin-bottom:6px}
nav a{display:flex;gap:10px;padding:10px 12px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px;cursor:pointer;border:1px solid transparent}
nav a:hover{background:var(--cyan-soft);border-color:var(--line)}
.quote{margin-top:auto;background:var(--cyan-soft);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:13px;color:var(--cyan)}
.quote b{display:block;margin-bottom:4px}
main{flex:1;padding:28px 34px;max-width:1280px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;margin-bottom:16px}
.badge{padding:4px 10px;border-radius:99px;font-size:12px;background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber)}
.badge.ok{background:var(--green-soft);color:var(--green);border-color:var(--green)}
.banner{background:var(--amber-soft);border:1px solid var(--amber);border-radius:12px;padding:14px 16px;margin-bottom:18px;display:none}
.banner.show{display:block}
.banner h3{margin:0 0 4px;font-size:15px;color:var(--amber)}.banner p{margin:2px 0;font-size:13px;color:var(--ink)}
.banner .row{margin-top:10px;display:flex;gap:8px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--cyan-soft);padding:8px 14px;color:var(--ink)}
button:hover{border-color:var(--cyan);box-shadow:0 0 12px rgba(56,189,248,.35)}
button.primary{background:linear-gradient(180deg,#1b8fd1,#1272aa);border-color:var(--cyan);color:#fff}
button:disabled{opacity:.6;cursor:wait}
.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;flex-wrap:wrap;margin-bottom:22px}
.hero small{color:var(--cyan);text-transform:uppercase;letter-spacing:.14em;font-size:11px}
.hero h1{margin:4px 0;font-size:34px;letter-spacing:-.02em}.hero p{margin:0;color:var(--muted)}
.balance{background:var(--card);border:1px solid var(--line);box-shadow:var(--glow);border-radius:12px;padding:14px 18px;display:flex;gap:18px;align-items:center}
.balance span{font-size:12px;color:var(--muted);display:block}.balance b{font-size:26px;color:var(--amber)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0 16px}
.filters strong{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
select,input{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:rgba(6,16,36,.9);color:var(--ink);width:100%}
select option{background:#0a1830;color:var(--ink)}
input::placeholder{color:var(--muted)}
input[type=date]{color-scheme:dark}
.filters select{width:auto}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);box-shadow:var(--glow);border-radius:12px;padding:18px;position:relative;backdrop-filter:blur(6px)}
.card::before,.card::after{content:"";position:absolute;width:10px;height:10px;border:2px solid var(--cyan);pointer-events:none}
.card::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:12px}
.card::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-bottom-right-radius:12px}
.kpi small{color:var(--muted);font-size:13px}.kpi b{display:block;font-size:28px;margin:6px 0 2px;color:var(--amber);letter-spacing:-.02em}.kpi span{font-size:12px;color:var(--muted)}
.kpi:nth-child(1) b{color:var(--green)}.kpi:nth-child(2) b{color:var(--red)}.kpi:nth-child(3) b{color:var(--cyan)}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-bottom:18px}
h2{margin:0 0 2px;font-size:18px}.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.legend{font-size:12px;color:var(--muted);display:flex;gap:12px;margin-top:8px}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}
.chart{display:flex;gap:10px;align-items:flex-end;height:190px;border-bottom:1px solid var(--line);padding-top:10px;overflow-x:auto}
.col{flex:1;min-width:46px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:pointer;border-radius:8px;padding:4px 2px}
.col:hover,.col.sel{background:var(--cyan-soft)}
.bars{display:flex;gap:4px;align-items:flex-end;height:150px}
.bar{width:14px;border-radius:4px 4px 0 0;min-height:2px}
.bar.exp{background:linear-gradient(180deg,#ff8a95,var(--red));box-shadow:0 0 10px rgba(255,93,108,.4)}
.bar.inc{background:linear-gradient(180deg,#7bf0cb,var(--green));box-shadow:0 0 10px rgba(47,214,160,.4)}
.col small{font-size:11px;color:var(--muted);margin-top:4px}
.rank{display:flex;flex-direction:column;gap:12px}
.rank div.r small{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.track{height:8px;background:var(--gray-soft);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--amber));border-radius:99px}
.insight{background:var(--cyan-soft);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:12px;font-size:13px;margin-top:14px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--cyan);padding:8px;border-bottom:1px solid var(--line);background:var(--cyan-soft)}
td{padding:11px 8px;border-bottom:1px solid rgba(56,189,248,.12);vertical-align:middle}
tbody tr:hover{background:var(--cyan-soft)}
td small{display:block;color:var(--muted);font-size:12px}
.tw{overflow-x:auto}
.pill{padding:3px 9px;border-radius:99px;font-size:12px;white-space:nowrap;border:1px solid transparent}
.p-Pago{background:var(--green-soft);color:var(--green);border-color:var(--green)}
.p-Naopago{background:var(--gray-soft);color:var(--muted);border-color:var(--muted)}
.p-Atrasado{background:var(--red-soft);color:var(--red);border-color:var(--red)}
.p-Aconfirmar{background:var(--amber-soft);color:var(--amber);border-color:var(--amber)}
.p-Cancelado{background:var(--gray-soft);color:var(--muted);text-decoration:line-through}
.neg{color:var(--red)}.pos{color:var(--green)}
.acts{white-space:nowrap;text-align:right}
.acts button{padding:4px 9px;margin-left:3px}
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.goal small{color:var(--muted)}.goal b{display:block;font-size:24px;margin:6px 0;color:var(--amber)}
.empty{color:var(--muted);text-align:center;padding:22px 0;font-size:14px}
section{margin-bottom:26px;scroll-margin-top:16px}
.modal{position:fixed;inset:0;background:rgba(2,8,20,.75);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.show{display:flex}
.box{background:#0a1830;border:1px solid var(--cyan);box-shadow:0 0 40px rgba(56,189,248,.25);border-radius:14px;padding:22px;width:100%;max-width:480px;max-height:92vh;overflow:auto}
.box h2{margin-bottom:4px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.form label{font-size:12px;color:var(--muted);display:block}
.form label input,.form label select{margin-top:4px}
.form .full{grid-column:1/-1}
.actions{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0a1830;border:1px solid var(--cyan);color:var(--ink);padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:20;box-shadow:0 0 20px rgba(56,189,248,.35)}
.toast.show{display:block}
.chip{border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer;background:var(--cyan-soft)}
.chip.on{background:var(--cyan);border-color:var(--cyan);color:#04101f}
@media(max-width:900px){body{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center}.quote{display:none}main{padding:18px}.kpis{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
</style>
